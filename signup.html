<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Verilancer</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/signup.css">
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">
            <a href="index.html">
                <img src="images/logo verilancer.jpeg" alt="Verilancer Logo">
            </a>
        </div>

        <ul class="nav-links">
            <li><a href="services.html">Services</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="how-it-works.html">How It Works</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li><a href="blogs.html">Blogs</a></li>
            <li><a href="about.html">About</a></li>
        </ul>

        <div class="buttons">
            <a href="login.html" class="login-btn">Log In</a>
            <a href="get-started.html" class="start-btn">Get Started</a>
        </div>

    </nav>
</header>


<main class="signup-page">

    <section class="signup-section">

        <div class="signup-card">

            <div class="signup-header">

                <span class="signup-tag">CREATE ACCOUNT</span>

                <h1>Join Verilancer.</h1>

                <p>
                    Create your account and become part of the ecosystem.
                </p>

            </div>


            <form class="signup-form">

                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Create Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">Confirm Password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button type="submit" class="signup-submit">
                    Create Account
                </button>

            </form>


            <div class="login-text">
                Already have an account?
                <a href="login.html">Log in</a>
            </div>

        </div>

    </section>

</main>


<footer class="simple-footer">
    <p>© 2026 Verilancer. All rights reserved.</p>
</footer>

<script src="js/auth.js"></script>
</body>
</html>
