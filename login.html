<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | Verilancer</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">
            <a href="index.html">
                <img src="images/logo verilancer.jpeg" alt="Verilancer Logo">
            </a>
        </div>

        <ul class="nav-links">
            <li><a href="services.html">Services</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="how-it-works.html">How It Works</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li><a href="blogs.html">Blogs</a></li>
            <li><a href="about.html">About</a></li>
        </ul>

        <div class="buttons">
            <a href="login.html" class="login-btn">Log In</a>
            <a href="get-started.html" class="start-btn">Get Started</a>
        </div>

    </nav>
</header>


<main class="login-page">

    <section class="login-section">

        <div class="login-card">

            <div class="login-header">

                <span class="login-tag">WELCOME BACK</span>

                <h1>Welcome back.</h1>

                <p>
                    Log in to continue to your Verilancer account.
                </p>

            </div>


            <form class="login-form">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">

                    <div class="password-label">
                        <label for="password">Password</label>

                        <a href="#">Forgot password?</a>
                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="login-submit">
                    Log In
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <div class="signup-text">
                Don't have an account?
                <a href="get-started.html">Get Started</a>
            </div>

        </div>

    </section>

</main>


<footer class="simple-footer">
    <p>© 2026 Verilancer. All rights reserved.</p>
</footer>

<script src="js/auth.js"></script>

</body>
</html>
